<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LASER ARENA</title>
  <style>
    body { margin: 0; overflow: hidden; background: #050510; font-family: Arial, sans-serif; }
    #ui { position: fixed; top: 20px; left: 20px; color: white; z-index: 10; }
    #health { font-size: 24px; }
    #score { font-size: 20px; margin-top: 10px; }
    #status { margin-top: 10px; font-size: 16px; }
    #instructions { position: fixed; bottom: 20px; left: 20px; color: white; z-index: 10; line-height: 1.5; }
  </style>
</head>
<body>
  <div id="ui">
    <div id="health">❤️ Health: 100</div>
    <div id="score">🏆 Score: 0</div>
    <div id="status">Waiting for another player...</div>
  </div>
  <div id="instructions">
    WASD = Move<br>
    Mouse = Turn spaceship<br>
    SPACE = Shoot
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="./game.js"></script>
</body>
</html>
